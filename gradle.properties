# 注意：保持 GBK（项目原有配置）。Windows 中文环境下调成 UTF-8 会让 test worker 的
# classpath 参数文件与 JVM 读取编码不一致，导致 GradleWorkerMain ClassNotFound。
# JDK 用机器的 JAVA_HOME（Android Studio 自带 jbr）；写死绝对路径换台机器就失效。
# 本机 8G 内存：daemon 堆 3G 起不来（页面文件不够，JVM 直接崩），
# 1024m + SerialGC 实测可跑全部 52 个测试类（逐类分批执行，避免单 JVM 累积压力）：
#   ./gradlew.bat :app:testDebugUnitTest --max-workers=1 --tests "com.example.zhishu.要跑的类"
org.gradle.jvmargs=-Xmx1024m -XX:+UseSerialGC -Dfile.encoding=GBK
# JDK 用机器的 JAVA_HOME（Android Studio 自带 jbr）；写死绝对路径换台机器就失效
android.useAndroidX=true
android.overridePathCheck=true
kotlin.code.style=official
android.nonTransitiveRClass=true
