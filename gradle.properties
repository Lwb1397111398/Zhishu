# 注意：保持 GBK（项目原有配置）。Windows 中文环境下调成 UTF-8 会让 test worker 的
# classpath 参数文件与 JVM 读取编码不一致，导致 GradleWorkerMain ClassNotFound。
# 本机内存紧张时全量单测请用命令行：./gradlew.bat testDebugUnitTest --max-workers=1
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GBK
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
android.useAndroidX=true
android.overridePathCheck=true
kotlin.code.style=official
android.nonTransitiveRClass=true
