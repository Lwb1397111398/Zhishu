# 注意：保持 GBK（项目原有配置）。Windows 中文环境下调成 UTF-8 会让 test worker 的
# classpath 参数文件与 JVM 读取编码不一致，导致 GradleWorkerMain ClassNotFound。
# 本机内存紧张时全量单测请用命令行：./gradlew.bat testDebugUnitTest --max-workers=1
# 2048m 跑全量单测会 OOM（Gradle worker 直接崩，报 jimage.dll / malloc failed），
# 提到 3G 后可以稳定跑完 470+ 个用例
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=GBK
org.gradle.java.home=C\:\\Users\\jingyue\\AndroidTools\\jdk\\jdk-17.0.20.1+1
android.useAndroidX=true
android.overridePathCheck=true
kotlin.code.style=official
android.nonTransitiveRClass=true
