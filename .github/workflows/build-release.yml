name: build-release

# 应用自更新：每次推 main 自动构建 Release APK 并发布到 latest Release，
# 手机端「检查更新」即可发现并下载安装，无需连电脑。
#
# 发版前先过质量闸（test job）：lint + 全量单元测试，任何一步失败
# release job 不会执行——坏版本发不出去，也就不会经自更新推到手机上。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint 检查
        run: ./gradlew lintDebug --no-daemon

      # 常规测试不含真实模型样本（SampleRunner 已在构建脚本里排除），
      # 不产生任何 API 费用
      - name: 单元测试
        run: ./gradlew testDebugUnitTest --no-daemon

      # 失败时把 XML 测试结果（含完整堆栈）留档，方便从本机 gh artifact 下载取证
      - name: 留档测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode = git 提交数，必须拿全量历史
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: 发布到 latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME="0.1.$CODE"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" Zhishu-latest.apk

          # 第一行 HTML 注释是机器可读元数据（App 解析 versionCode 判断有无新版本），
          # GitHub 页面渲染时不可见
          {
            echo "<!-- zhishu-update versionCode=$CODE versionName=$NAME -->"
            echo "自动构建 · 提交 ${GITHUB_SHA::7}"
            echo
            echo "更新内容："
            git log --pretty=format:'- %s' -5
          } > notes.md

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Zhishu-latest.apk --clobber
            gh release edit latest --title "知述 App $NAME" --notes-file notes.md
          else
            gh release create latest Zhishu-latest.apk \
              --title "知述 App $NAME" --notes-file notes.md
          fi
          echo "已发布：versionCode=$CODE versionName=$NAME"
